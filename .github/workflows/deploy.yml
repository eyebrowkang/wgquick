name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --dir web --frozen-lockfile

      - name: Build Go WebAssembly module
        run: GOOS=js GOARCH=wasm go build -o web/public/main.wasm ./cmd/wasm

      - name: Lint frontend
        run: pnpm --dir web run lint

      - name: Build frontend
        run: pnpm --dir web run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: 'pages deploy web/dist --project-name ${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main'
          wranglerVersion: 3
